                    id: mat.id,
                    label: mat.nombre,
                    level: cuatrimestreActual, // Esto arma las columnas de cuatrimestres
                    shape: 'box',
                    color: {
                        background: estaAprobada ? colorArea : '#ffffff',
                        border: estaAprobada ? colorArea : '#aaaaaa'
                    },
                    font: {
                        color: estaAprobada ? '#ffffff' : '#333333',
                        face: 'Segoe UI',
                        size: 12
                    },
                    borderWidth: estaAprobada ? 0 : 2
                });
            });

            let edgesArray = flechasData.map(rel => {
                let estaAprobada = resultados[rel.from];
                return {
                    from: rel.from,
                    to: rel.to,
                    arrows: 'to',
                    color: {
                        // Si es invisible, transparente. Si no, usa el color de área.
                        color: rel.invisible ? 'transparent' : (estaAprobada ? (coloresMapa[rel.from] || '#333') : '#cccccc'),
                        opacity: rel.invisible ? 0 : (estaAprobada ? 1 : 0.5)
                    },
                    width: rel.invisible ? 0 : (estaAprobada ? 2 : 1)
                };
            });

            // Si es la primera vez, inicializamos la red
            if (!network) {
                nodesDataset.add(nodosArray);
                edgesDataset.add(edgesArray);
                
                let container = document.getElementById('red-vis');
                let data = { nodes: nodesDataset, edges: edgesDataset };
                
                // Configuración de la física y el diseño estilo "Cuadrícula Estricta"
                let options = {
                    layout: {
                        hierarchical: {
                            enabled: true,
                            direction: 'LR', // De Izquierda a Derecha (Cuatrimestres como columnas)
                            levelSeparation: 250, // Distancia horizontal entre los cuatrimestres
                            nodeSpacing: 70, // Distancia vertical fija entre las "filas" de materias
                            treeSpacing: 70, // Distancia entre ramas o materias sueltas
                            blockShifting: true, // Intenta agrupar las sueltas en bloques compactos
                            edgeMinimization: true, // Intenta cruzar las flechas lo menos posible
                            parentCentralization: false, // Evita que las materias se amontonen en el centro
                            sortMethod: 'directed' // Ordena basado en las flechas (y empuja las sueltas al fondo)
                        }
                    },
                    physics: {
                        enabled: false // Apagamos la física de resortes para que la estructura sea rígida como una tabla
                    },
                    edges: {
                        smooth: { 
                            type: 'cubicBezier', 
                            forceDirection: 'horizontal', 
                            roundness: 0.5 
                        }
                    }
                };
                network = new vis.Network(container, data, options);
            } else {
                // Si ya existe, solo actualizamos colores
                nodesDataset.update(nodosArray);
                edgesDataset.update(edgesArray);
            }
        } // FIN DE CALCULAR()

        // 5. FUNCIÓN PARA EXPORTAR A PNG (PÓSTER HD - VERSIÓN MÓVIL SÍNCRONA)
        function descargarPNG() {
            if (!network) return alert("El mapa aún no se ha generado.");

            // 1. Guardamos el estado original
            const container = document.getElementById('red-vis');
            const originalWidth = container.style.width;
            const originalHeight = container.style.height;
            const zoomOriginal = network.getScale();
            const posicionOriginal = network.getViewPosition();

            // 2. Calculamos el tamaño físico real de todo el mapa extendido
            const boundingBox = network.getBoundingBox();
            const anchoReal = Math.abs(boundingBox.right - boundingBox.left) + 100;
            const altoReal = Math.abs(boundingBox.bottom - boundingBox.top) + 100;

            const nuevoAncho = Math.max(anchoReal, 1000) + 'px';
            const nuevoAlto = Math.max(altoReal, 1500) + 'px';

            // 3. Agrandamos el contenedor y forzamos a Vis.js a dibujarlo AL INSTANTE
            container.style.width = nuevoAncho;
            container.style.height = nuevoAlto;
            network.setSize(nuevoAncho, nuevoAlto);
            network.fit({ animation: false }); // Encuadra sin animaciones
            network.redraw(); // Dibuja la máxima calidad inmediatamente

            // 4. Sacamos la foto (Todo en el mismo milisegundo del clic)
            const canvasElement = document.querySelector('#red-vis canvas');
            const canvasTemp = document.createElement('canvas');
            canvasTemp.width = canvasElement.width;
            canvasTemp.height = canvasElement.height;
            const ctx = canvasTemp.getContext('2d');
            
            // Fondo blanco
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, canvasTemp.width, canvasTemp.height);
            ctx.drawImage(canvasElement, 0, 0);

            // Simulamos el clic de descarga y el celular ahora sí lo permite
            const link = document.createElement('a');
            link.download = 'Mapa_Correlatividades_HD.png';
            link.href = canvasTemp.toDataURL('image/png');
            link.click();

            // 5. Restauramos todo a la normalidad instantáneamente
            container.style.width = originalWidth;
            container.style.height = originalHeight;
            network.setSize(originalWidth, originalHeight);
            network.moveTo({
                position: posicionOriginal,
                scale: zoomOriginal,
                animation: false
            });
        }


        window.addEventListener('load', calcular);
    </script>
</body>
