            margin-top: 25px;
            font-size: 1.1rem;
        }

            margin-top: 25px;
            overflow-x: auto;
        }

        .mapa-grid {
            display: flex;
            gap: 15px;
            min-width: 600px;
            padding-bottom: 10px;
        }

        .cuatrimestre {

            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
        }

            padding: 10px;

        function generarMapa() {
    const boton = document.getElementById('btn-generar');
    const contenedorOculto = document.getElementById('red-oculta');
    const contenedorImagen = document.getElementById('contenedor-imagen');

    boton.innerText = "Dibujando mapa...";
    boton.disabled = true;
    boton.style.backgroundColor = "#6c757d";
    contenedorImagen.innerHTML = "";

    // Tamaño del canvas oculto, limitado según la densidad de píxeles
    // (Safari/iOS falla con canvas de más de ~16 Mpx)
    const dpr = window.devicePixelRatio || 1;
    let W = 2500, H = 1500;
    const k = Math.min(1, Math.sqrt(12e6 / (W * H * dpr * dpr)));
    W = Math.floor(W * k);
    H = Math.floor(H * k);

    contenedorOculto.style.position = "fixed";
    contenedorOculto.style.top = "0";
    contenedorOculto.style.left = "0";
    contenedorOculto.style.width = W + "px";
    contenedorOculto.style.height = H + "px";
    contenedorOculto.style.visibility = "visible";
    contenedorOculto.style.opacity = "0";
    contenedorOculto.style.pointerEvents = "none";
    contenedorOculto.style.zIndex = "-1";

    const nodosArray = [];
    let cuatrimestreActual = 1;

    materias2027.forEach(mat => {
        if (mat.separador) {
            cuatrimestreActual = parseInt(mat.separador.replace(/\D/g, '')) || cuatrimestreActual + 1;
        }

        const estaAprobada = !!window.resultadosGlobales?.[mat.id];
        const colorArea = coloresMapa[mat.id] || "#555555";

        nodosArray.push({
            id: mat.id,
            label: mat.nombre,
            level: cuatrimestreActual,
            shape: "box",
            color: {
                background: estaAprobada ? colorArea : "#ffffff",
                border: estaAprobada ? colorArea : "#aaaaaa"
            },
            font: {
                color: estaAprobada ? "#ffffff" : "#333333",
                face: "Segoe UI",
                size: 14
            },
            borderWidth: estaAprobada ? 0 : 2
        });
    });

    const edgesArray = flechasData.map(rel => {
        const estaAprobada = !!window.resultadosGlobales?.[rel.from];
        return {
            from: rel.from,
            to: rel.to,
            arrows: "to",
            color: {
                color: rel.invisible
                    ? "transparent"
                    : (estaAprobada ? (coloresMapa[rel.from] || "#333") : "#cccccc"),
                opacity: rel.invisible ? 0 : (estaAprobada ? 1 : 0.6)
            },
            width: rel.invisible ? 0 : (estaAprobada ? 3 : 1)
        };
    });

    const options = {
        layout: {
            hierarchical: {
                enabled: true,
                direction: "LR",
                levelSeparation: 280,
                nodeSpacing: 70,
                treeSpacing: 70,
                blockShifting: true,
                edgeMinimization: true,
                parentCentralization: true
            }
        },
        physics: { enabled: false },
        edges: {
            smooth: {
                type: "cubicBezier",
                forceDirection: "horizontal",
                roundness: 0.5
            }
        }
    };

    const networkOculta = new vis.Network(
        contenedorOculto,
        { nodes: nodosArray, edges: edgesArray },
        options
    );

    const falla = (motivo) => {
        console.error("Exportar mapa:", motivo);
        boton.disabled = false;
        boton.innerText = "Intentar de nuevo";
        boton.style.backgroundColor = "#0d6efd";
        try { networkOculta.destroy(); } catch (e) {}
        contenedorImagen.innerHTML = '<p style="color:#dc3545;font-weight:bold;">No se pudo generar el mapa. Probá de nuevo.</p>';
    };

    networkOculta.once("afterDrawing", () => {
        try {
            networkOculta.fit({ animation: false });
            networkOculta.redraw();   // síncrono: el canvas ya queda con la vista ajustada
            exportarMapa(networkOculta, contenedorOculto, nodosArray, boton, contenedorImagen, falla);
        } catch (err) {
            falla(err);
        }
    });

    // Red de seguridad: si por algún motivo no se dibuja, no dejar el botón trabado
    setTimeout(() => {
        if (boton.disabled && boton.innerText.includes("Dibujando")) falla("timeout");
    }, 10000);
}

function exportarMapa(network, contenedor, nodos, boton, contenedorImagen, falla) {
    const canvas = contenedor.querySelector("canvas");
    if (!canvas) return falla("no hay canvas");

    // getBoundingBox() EXIGE un nodeId: se calcula la unión de las cajas de todos los nodos
    let L = Infinity, T = Infinity, R = -Infinity, B = -Infinity;
    nodos.forEach(n => {
        const b = network.getBoundingBox(n.id);
        if (!b) return;
        L = Math.min(L, b.left);
        T = Math.min(T, b.top);
        R = Math.max(R, b.right);
        B = Math.max(B, b.bottom);
    });
    if (!isFinite(L)) return falla("no se pudo calcular el bounding box");

    // Coordenadas de red -> píxeles del canvas (el canvas ya contiene la vista ajustada)
    const tl = network.canvasToDOM({ x: L, y: T });
    const br = network.canvasToDOM({ x: R, y: B });
    const ratio = canvas.width / contenedor.clientWidth;
    const pad = 40;

    const sx = Math.max(0, Math.floor(tl.x * ratio - pad));
    const sy = Math.max(0, Math.floor(tl.y * ratio - pad));
    const sw = Math.min(canvas.width - sx, Math.ceil((br.x - tl.x) * ratio + 2 * pad));
    const sh = Math.min(canvas.height - sy, Math.ceil((br.y - tl.y) * ratio + 2 * pad));
    if (sw <= 0 || sh <= 0) return falla("recorte inválido");

    const salida = document.createElement("canvas");
    salida.width = sw;
    salida.height = sh;
    const ctx = salida.getContext("2d");
    ctx.fillStyle = "#fafafa";
    ctx.fillRect(0, 0, sw, sh);
    ctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);

    salida.toBlob((blob) => {
        if (!blob) return falla("toBlob devolvió null");

        const blobUrl = URL.createObjectURL(blob);

        const mensaje = document.createElement("p");
        mensaje.innerText = "Mapa generado. Tocá el botón para descargarlo.";
        mensaje.style.fontWeight = "bold";
        mensaje.style.color = "#198754";
        mensaje.style.marginTop = "15px";

        const img = document.createElement("img");
        img.src = blobUrl;
        img.style.width = "100%";
        img.style.border = "3px solid #198754";
        img.style.borderRadius = "8px";
        img.style.boxShadow = "0 4px 8px rgba(0,0,0,0.1)";

        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = "Mapa_Correlatividades_INEL.png";
        link.textContent = "Descargar PNG";
        link.style.cssText = "display:inline-block;margin-top:12px;padding:10px 18px;background:#198754;color:#fff;border-radius:8px;font-weight:bold;text-decoration:none;";

        contenedorImagen.innerHTML = "";
        contenedorImagen.appendChild(mensaje);
        contenedorImagen.appendChild(img);
        contenedorImagen.appendChild(link);

        boton.innerText = "Volver a generar mapa";
        boton.disabled = false;
        boton.style.backgroundColor = "#198754";

        network.destroy();
    }, "image/png");
}

        window.addEventListener('load', calcular);
